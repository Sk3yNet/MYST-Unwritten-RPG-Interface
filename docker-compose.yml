# Unwritten Table: one Portainer stack, same shape as the Replicant Space client.
#
#   Internet ─► Cloudflare ─► cloudflared ─► nginx ─(auth_request)─► oauth2-proxy (Google: who are you?)
#                                              │
#                                              └─► app (FastAPI + htmx, SQLite, live table over SSE)
#
# Anyone with a Google account can sign in (unless ALLOWED_EMAIL / ALLOWED_DOMAINS narrow it); a campaign is only
# visible to people who joined it through its invite link. No host ports are published: the tunnel is the only way in.
# Portainer: Stacks ▸ Add stack ▸ Repository (this repo), then fill in the variables listed in .env.example.

name: unwritten-table

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN}
    depends_on: [nginx]
    restart: unless-stopped
    networks: [edge]

  nginx:
    build: ./nginx
    # Built from this repo, never pulled; rebuilt on every (re)deploy so config changes land.
    pull_policy: build
    depends_on: [oauth2-proxy, app]
    restart: unless-stopped
    networks: [edge]
    # Uncomment for LAN debugging (sign-in still redirects to PUBLIC_HOST):
    # ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${PUBLIC_HOST}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      # Google says who you are; the app decides what you may see (invite links, ALLOWED_EMAIL, GM_EMAILS).
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    restart: unless-stopped
    networks: [edge]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    pull_policy: build
    environment:
      DB_PATH: /data/unwritten.sqlite
      # Optional: narrow who may sign in at all (comma-separated). Empty = any Google account.
      ALLOWED_EMAILS: ${ALLOWED_EMAIL:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # Optional: who may start campaigns (be a GM). Empty = anyone signed in.
      GM_EMAILS: ${GM_EMAILS:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - unwritten-data:/data
    stop_grace_period: 15s
    restart: unless-stopped
    networks: [edge]

volumes:
  unwritten-data:

networks:
  edge:
