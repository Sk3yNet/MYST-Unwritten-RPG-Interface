<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680"><defs><filter id="jearth-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="620" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 310.0 340.0)"><rect x="30" y="24" width="560" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="560" height="632" fill="#000" filter="url(#jearth-age)"/><text x="70" y="82" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">from the Cartographer’s journal</text><line x1="70" y1="96" x2="560" y2="96" stroke="#8c6a2c"/><text x="70" y="140" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">“Nothing is solved quickly.”</text><text x="70" y="190" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">Each bed I tend wakes the one beside it,</text><text x="70" y="220" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">and pushes it a season on. Plant them</text><text x="70" y="250" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">all at once and the garden undoes you.</text><text x="70" y="280" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">Begin at the center. Set one, wake it,</text><text x="70" y="310" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">and only then set the next — outward,</text><text x="70" y="340" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">ring by ring, as roots grow.</text><path d="M50 50 C50 44 58 44 58 50 C58 60 44 62 42 50 C40 34 62 30 68 48 C74 68 50 80 36 70 C22 60 22 34 40 24" transform="translate(190 400) scale(-1.1 1.1)" fill="none" stroke="#3a2816" stroke-width="6.36364" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="540" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">the earth glyph</text><rect x="230" y="395" width="170" height="150" fill="#1d2440" rx="6"/><line x1="315" y1="419.6" x2="295.4" y2="458.8" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="315" y1="419.6" x2="334.6" y2="458.8" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="295.4" y1="458.8" x2="303.8" y2="495.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="334.6" y1="458.8" x2="326.2" y2="495.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="303.8" y1="495.2" x2="315" y2="523.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="326.2" y1="495.2" x2="315" y2="523.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="295.4" y1="458.8" x2="334.6" y2="458.8" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><circle cx="315" cy="419.6" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="295.4" cy="458.8" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="334.6" cy="458.8" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="303.8" cy="495.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="326.2" cy="495.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="315" cy="523.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><text x="255" y="565" font-family="IM Fell English, Georgia, serif" font-size="16" fill="#3a2816" font-style="italic">The Seed</text><line x1="430" y1="440" x2="550" y2="440" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="449" x2="550" y2="449" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="458" x2="550" y2="458" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="467" x2="550" y2="467" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="476" x2="550" y2="476" stroke="#3a2816" stroke-width="1"/><ellipse cx="490" cy="480.5" rx="7" ry="4.8" fill="none" stroke="#3a2816" stroke-width="2.4" transform="rotate(-20 490 480.5)"/><text x="445" y="530" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">its voice: D</text><text x="500" y="620" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">— E.</text></g></svg>
