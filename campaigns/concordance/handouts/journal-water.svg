<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680"><defs><filter id="jwater-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="620" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 310.0 340.0)"><rect x="30" y="24" width="560" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="560" height="632" fill="#000" filter="url(#jwater-age)"/><text x="70" y="82" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">from the Cartographer’s journal</text><line x1="70" y1="96" x2="560" y2="96" stroke="#8c6a2c"/><text x="70" y="140" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">“The world is never seen directly.”</text><text x="70" y="190" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">What I painted on the dome is written</text><text x="70" y="220" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">backwards, as a mirror writes. Read it</text><text x="70" y="250" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">in the still pool and it shows what the</text><text x="70" y="280" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">rings must become. Read it directly and</text><text x="70" y="310" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">it shows what you must set — for the</text><text x="70" y="340" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">fire turns every glyph to its twin.</text><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(190 400) scale(-1.1 1.1)" fill="none" stroke="#3a2816" stroke-width="6.36364" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="540" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">the water glyph</text><rect x="230" y="395" width="170" height="150" fill="#1d2440" rx="6"/><line x1="267.4" y1="433.6" x2="295.4" y2="422.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="295.4" y1="422.4" x2="312.2" y2="456" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="312.2" y1="456" x2="326.2" y2="489.6" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="326.2" y1="489.6" x2="357" y2="500.8" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="326.2" y1="489.6" x2="306.6" y2="526" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><circle cx="267.4" cy="433.6" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="295.4" cy="422.4" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="312.2" cy="456" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="326.2" cy="489.6" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="357" cy="500.8" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="306.6" cy="526" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><text x="255" y="565" font-family="IM Fell English, Georgia, serif" font-size="16" fill="#3a2816" font-style="italic">The Heron</text><line x1="430" y1="440" x2="550" y2="440" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="449" x2="550" y2="449" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="458" x2="550" y2="458" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="467" x2="550" y2="467" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="476" x2="550" y2="476" stroke="#3a2816" stroke-width="1"/><ellipse cx="490" cy="462.5" rx="7" ry="4.8" fill="none" stroke="#3a2816" stroke-width="2.4" transform="rotate(-20 490 462.5)"/><text x="445" y="530" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">its voice: A</text><text x="500" y="620" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">— E.</text></g></svg>
