<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680"><defs><filter id="jice-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="620" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 310.0 340.0)"><rect x="30" y="24" width="560" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="560" height="632" fill="#000" filter="url(#jice-age)"/><text x="70" y="82" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">from the Cartographer’s journal</text><line x1="70" y1="96" x2="560" y2="96" stroke="#8c6a2c"/><text x="70" y="140" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">“Memory never lies — but it never changes.”</text><text x="70" y="190" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">I froze this world to keep it, and it kept</text><text x="70" y="220" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">everything: the telescopes, the snow, the</text><text x="70" y="250" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">last night I looked at the stars here.</text><text x="70" y="280" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">The heart of the machine is the same.</text><text x="70" y="310" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">The innermost ring holds what was.</text><text x="70" y="340" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">It is already right. Do not turn it.</text><path d="M50 10 V90 M15.4 30 L84.6 70 M15.4 70 L84.6 30 M42 16 L50 24 L58 16 M42 84 L50 76 L58 84 M17 40 L26 36 L22 27 M83 60 L74 64 L78 73 M17 60 L26 64 L22 73 M83 40 L74 36 L78 27" transform="translate(80 400) scale(1.1)" fill="none" stroke="#3a2816" stroke-width="6.36364" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="540" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">the ice glyph</text><rect x="230" y="395" width="170" height="150" fill="#1d2440" rx="6"/><line x1="315" y1="422.4" x2="292.6" y2="450.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="315" y1="422.4" x2="337.4" y2="450.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="292.6" y1="450.4" x2="292.6" y2="495.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="337.4" y1="450.4" x2="337.4" y2="495.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="292.6" y1="495.2" x2="315" y2="520.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="337.4" y1="495.2" x2="315" y2="520.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="292.6" y1="450.4" x2="337.4" y2="450.4" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><circle cx="315" cy="422.4" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="292.6" cy="450.4" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="337.4" cy="450.4" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="292.6" cy="495.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="337.4" cy="495.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="315" cy="520.4" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><text x="255" y="565" font-family="IM Fell English, Georgia, serif" font-size="16" fill="#3a2816" font-style="italic">The Lantern</text><line x1="430" y1="440" x2="550" y2="440" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="449" x2="550" y2="449" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="458" x2="550" y2="458" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="467" x2="550" y2="467" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="476" x2="550" y2="476" stroke="#3a2816" stroke-width="1"/><ellipse cx="490" cy="476" rx="7" ry="4.8" fill="none" stroke="#3a2816" stroke-width="2.4" transform="rotate(-20 490 476)"/><text x="445" y="530" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">its voice: E</text><text x="500" y="620" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">— E.</text></g></svg>
