<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680"><defs><filter id="im-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="560" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 280.0 340.0)"><rect x="30" y="24" width="500" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="500" height="632" fill="#000" filter="url(#im-age)"/><text x="70" y="80" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">Notes on the mirror terrace</text><circle cx="110" cy="190" r="26" fill="#f3d68e" stroke="#3a2816"/><text x="70" y="240" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">sun (east, low)</text><g transform="translate(250 190) rotate(30)"><rect x="-30" y="-6" width="60" height="12" fill="#cfe6f2" stroke="#3a2816" stroke-width="2"/></g><text x="244" y="224" font-family="IM Fell English, Georgia, serif" font-size="20">A</text><g transform="translate(420 300) rotate(-20)"><rect x="-30" y="-6" width="60" height="12" fill="#cfe6f2" stroke="#3a2816" stroke-width="2"/></g><text x="414" y="334" font-family="IM Fell English, Georgia, serif" font-size="20">B</text><g transform="translate(260 420) rotate(60)"><rect x="-30" y="-6" width="60" height="12" fill="#cfe6f2" stroke="#3a2816" stroke-width="2"/></g><text x="254" y="454" font-family="IM Fell English, Georgia, serif" font-size="20">C</text><text x="70" y="500" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">A takes the sun. B looks to the Hall,</text><text x="70" y="528" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">or up to the Dome. C looks down, to the dam.</text><text x="70" y="556" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">A moment of light melts a wall. Too long,</text><text x="70" y="584" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">and it melts the floor beneath, and the hall</text><text x="70" y="612" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">drowns. Light it, then let it go dark.</text></g></svg>
