<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700"><defs><filter id="ec-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="600" height="700" fill="#2a1d12"/><g transform="rotate(-1.2 300.0 350.0)"><rect x="30" y="24" width="540" height="652" fill="#ecdcb8"/><rect x="30" y="24" width="540" height="652" fill="#000" filter="url(#ec-age)"/><text x="70" y="80" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">The Calendar Stone (rubbing)</text><circle cx="300" cy="310" r="40" fill="none" stroke="#3a2816" stroke-width="2"/><circle cx="300" cy="310" r="75" fill="none" stroke="#3a2816" stroke-width="2"/><circle cx="300" cy="310" r="110" fill="none" stroke="#3a2816" stroke-width="2"/><circle cx="300" cy="310" r="145" fill="none" stroke="#3a2816" stroke-width="2"/><circle cx="300" cy="310" r="180" fill="none" stroke="#3a2816" stroke-width="2"/><text x="300" y="155" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="16">Rain</text><text x="452" y="266" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="16">Sun</text><text x="394" y="444" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="16">Rain &amp; Sun</text><text x="206" y="444" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="16">Growth</text><text x="148" y="266" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="16">Rest</text><circle cx="300" cy="310" r="10" fill="#7a5a36"/><text x="70" y="540" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">Each wheel, turned, turns the one outside it</text><text x="70" y="568" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">a season on. The tree wakes only when all</text><text x="70" y="596" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">five show Rest. Begin at the heart.</text><text x="70" y="640" font-family="IM Fell English, Georgia, serif" font-size="17" fill="#3a2816" font-style="italic">Rain, then Sun, then both: so the beds grow.</text></g></svg>
