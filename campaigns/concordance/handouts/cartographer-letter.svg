<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680"><defs><filter id="cl-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="620" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 310.0 340.0)"><rect x="30" y="24" width="560" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="560" height="632" fill="#000" filter="url(#cl-age)"/><text x="70" y="90" font-family="IM Fell English, Georgia, serif" font-size="23" fill="#3a2816" font-style="italic">To whoever wakes the Concordance —</text><text x="70" y="150" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">If it sings, you have learned what I learned:</text><text x="70" y="180" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">to keep, to change, to look, to wait, and to</text><text x="70" y="210" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">see the world in its reflection. The machine</text><text x="70" y="240" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">does not open a door. It writes one.</text><text x="70" y="270" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816"></text><text x="70" y="300" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">On my desk is a Book with no Age in it yet.</text><text x="70" y="330" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">The Concordance will hold any world you</text><text x="70" y="360" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">write there steady, as long as all five rules</text><text x="70" y="390" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">are honored together. I could not finish it</text><text x="70" y="420" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">alone; I was never patient enough.</text><text x="70" y="450" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816"></text><text x="70" y="480" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">It is yours now. Write carefully.</text><text x="70" y="510" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">Write together.</text><text x="330" y="610" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">— Ereva, Cartographer</text></g></svg>
