<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680"><defs><filter id="fm-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="600" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 300.0 340.0)"><rect x="30" y="24" width="540" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="540" height="632" fill="#000" filter="url(#fm-age)"/><text x="70" y="80" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">The five molds of the Bell Foundry</text><rect x="70" y="120" width="80" height="80" fill="#b08a55" stroke="#3a2816" stroke-width="2"/><path d="M50 10 V90 M15.4 30 L84.6 70 M15.4 70 L84.6 30 M42 16 L50 24 L58 16 M42 84 L50 76 L58 84 M17 40 L26 36 L22 27 M83 60 L74 64 L78 73 M17 60 L26 64 L22 73 M83 40 L74 36 L78 27" transform="translate(80 130) scale(0.6)" fill="none" stroke="#f3ead2" stroke-width="8.33333" stroke-linecap="round" stroke-linejoin="round"/><rect x="166" y="120" width="80" height="80" fill="#b08a55" stroke="#3a2816" stroke-width="2"/><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(176 130) scale(0.6)" fill="none" stroke="#f3ead2" stroke-width="8.33333" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="120" width="80" height="80" fill="#b08a55" stroke="#3a2816" stroke-width="2"/><path d="M50 50 C50 44 58 44 58 50 C58 60 44 62 42 50 C40 34 62 30 68 48 C74 68 50 80 36 70 C22 60 22 34 40 24" transform="translate(272 130) scale(0.6)" fill="none" stroke="#f3ead2" stroke-width="8.33333" stroke-linecap="round" stroke-linejoin="round"/><rect x="358" y="120" width="80" height="80" fill="#b08a55" stroke="#3a2816" stroke-width="2"/><path d="M50 50 C50 44 58 44 58 50 C58 60 44 62 42 50 C40 34 62 30 68 48 C74 68 50 80 36 70 C22 60 22 34 40 24" transform="translate(428 130) scale(-0.6 0.6)" fill="none" stroke="#f3ead2" stroke-width="8.33333" stroke-linecap="round" stroke-linejoin="round"/><rect x="454" y="120" width="80" height="80" fill="#b08a55" stroke="#3a2816" stroke-width="2"/><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(524 130) scale(-0.6 0.6)" fill="none" stroke="#f3ead2" stroke-width="8.33333" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="250" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">Cast in the mold, the bronze comes out</text><text x="70" y="278" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">carved the other way: what the mold holds</text><text x="70" y="306" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">as a hollow, the bell wears as a shape.</text><text x="70" y="370" font-family="IM Fell English, Georgia, serif" font-size="21" fill="#3a2816" font-style="italic">“To cast the flame, carve the tide.”</text><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(210 410) scale(-0.9 0.9)" fill="none" stroke="#3a2816" stroke-width="6.66667" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="470" font-size="40" font-family="serif">→</text><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(300 410) scale(0.9)" fill="none" stroke="#3a2816" stroke-width="6.66667" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="540" font-family="IM Fell English, Georgia, serif" font-size="17" fill="#3a2816" font-style="italic">Mold  →  bell</text><text x="70" y="590" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">The anvil above the crucible bears the</text><text x="70" y="618" font-family="IM Fell English, Georgia, serif" font-size="19" fill="#3a2816">flame. Only a flame bell will wake it.</text></g></svg>
