<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680"><defs><filter id="jfire-age"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .3 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="620" height="680" fill="#2a1d12"/><g transform="rotate(-1.2 310.0 340.0)"><rect x="30" y="24" width="560" height="632" fill="#ecdcb8"/><rect x="30" y="24" width="560" height="632" fill="#000" filter="url(#jfire-age)"/><text x="70" y="82" font-family="IM Fell English, Georgia, serif" font-size="24" fill="#3a2816" font-style="italic">from the Cartographer’s journal</text><line x1="70" y1="96" x2="560" y2="96" stroke="#8c6a2c"/><text x="70" y="140" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">“To understand truth, one must allow it to change.”</text><text x="70" y="190" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">Nothing leaves the fire as it went in.</text><text x="70" y="220" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">The molds taught me: to cast a flame you</text><text x="70" y="250" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">must carve the tide; to cast the wind,</text><text x="70" y="280" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">carve the stone. Only ice comes out as</text><text x="70" y="310" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">ice. So it is with my rings: each one</text><text x="70" y="340" font-family="IM Fell English, Georgia, serif" font-size="20" fill="#3a2816">wakes as the opposite of what you set.</text><path d="M40 92 C18 84 16 58 32 40 C42 28 44 16 62 6 C58 26 76 34 80 54 C84 76 66 94 40 92 Z M44 80 C36 72 40 60 50 54" transform="translate(80 400) scale(1.1)" fill="none" stroke="#3a2816" stroke-width="6.36364" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="540" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">the fire glyph</text><rect x="230" y="395" width="170" height="150" fill="#1d2440" rx="6"/><line x1="261.8" y1="461.6" x2="368.2" y2="461.6" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="261.8" y1="461.6" x2="289.8" y2="481.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="368.2" y1="461.6" x2="340.2" y2="481.2" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="289.8" y1="481.2" x2="295.4" y2="512" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="340.2" y1="481.2" x2="334.6" y2="512" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><line x1="295.4" y1="512" x2="334.6" y2="512" stroke="#c9d1f0" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/><circle cx="261.8" cy="461.6" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="368.2" cy="461.6" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="289.8" cy="481.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="340.2" cy="481.2" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="295.4" cy="512" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><circle cx="334.6" cy="512" r="3.2" fill="#f3d68e" stroke="#c9d1f0" stroke-width="1"/><text x="255" y="565" font-family="IM Fell English, Georgia, serif" font-size="16" fill="#3a2816" font-style="italic">The Anvil</text><line x1="430" y1="440" x2="550" y2="440" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="449" x2="550" y2="449" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="458" x2="550" y2="458" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="467" x2="550" y2="467" stroke="#3a2816" stroke-width="1"/><line x1="430" y1="476" x2="550" y2="476" stroke="#3a2816" stroke-width="1"/><line x1="478" y1="485" x2="502" y2="485" stroke="#3a2816" stroke-width="1"/><ellipse cx="490" cy="485" rx="7" ry="4.8" fill="none" stroke="#3a2816" stroke-width="2.4" transform="rotate(-20 490 485)"/><text x="445" y="530" font-family="IM Fell English, Georgia, serif" font-size="15" fill="#3a2816" font-style="italic">its voice: C</text><text x="500" y="620" font-family="IM Fell English, Georgia, serif" font-size="22" fill="#3a2816" font-style="italic">— E.</text></g></svg>
