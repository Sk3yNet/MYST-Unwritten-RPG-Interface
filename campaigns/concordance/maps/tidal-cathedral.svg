<rect x="0" y="0" width="1000" height="700" fill="#e2e4e6"/><rect x="14" y="14" width="972" height="672" fill="none" stroke="#6b4a24" stroke-width="3"/><rect x="22" y="22" width="956" height="656" fill="none" stroke="#6b4a24" stroke-width="1"/><text x="40" y="62" font-family="IM Fell English, Georgia, serif" font-size="30" fill="#3a2816">The Tidal Cathedral</text><text x="42" y="88" font-family="IM Fell English, Georgia, serif" font-size="17" font-style="italic" fill="#3a2816">Age of Reflection</text><g transform="translate(940,630)" stroke="#6b4a24" fill="none" stroke-width="1.5"><circle r="26"/><path d="M0 -34 L6 0 L0 34 L-6 0 Z" fill="#8c6a2c"/><path d="M-34 0 L0 -5 L34 0 L0 5 Z"/><text y="-38" text-anchor="middle" font-size="13" fill="#3a2816" stroke="none" font-family="Georgia,serif">N</text></g>
