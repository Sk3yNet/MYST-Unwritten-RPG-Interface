# The Concordance: five elemental Ages and the machine that binds them.
# Concept by the table's GM (developed with ChatGPT); written up for Unwritten Table. Original fan content.
# Maps and handouts are generated by source/art.py; the full solution walkthrough is in GUIDE.md.
title: The Concordance
summary: >
  The explorers wake in an abandoned library built around a great machine, the Concordance, which is missing five
  Resonance Keys. Five Linking Books lead to five elemental Ages (ice, fire, air, earth, water), each with its own
  logic, its own puzzles, and one rule of reality. Only by learning all five rules can they wake the machine.
players: 2-5 explorers, about 8-12 sessions
book:                       # how it appears on the lobby shelf
  spine: Concordance
  volume: "Vol. II"
  color: "#5e2a14"
  cover: handouts/cover.svg
  preview: handouts/preview.svg
gm_intro: |
  **The shape of the campaign.** The Sanctuary is the hub. Each Age is a self-contained world with one rule:
  **Ice preserves, Fire transforms, Air observes, Earth grows, Water reflects.** Every Age yields five things:
  a Resonance Key, a glyph, a musical tone, a constellation, and a journal page. On their own they look like
  philosophy; together they are the instructions for the Concordance.

  **The final solution in one breath** (full walkthrough in GUIDE.md):

  * The Concordance has five rings. Each rim is marked with a constellation (star dots only); the five charts
    from the Ages tell which ring is which: Lantern (innermost), Anvil, Kite, Seed, Heron (outermost).
  * **Ice: don't touch the inner ring.** It is frozen and already shows the Ice glyph.
  * **Fire: activating a ring flips its glyph to its twin** (Fire↔Water, Air↔Earth). Set the twin of what you want.
  * **Earth: activating a ring nudges the next ring outward.** Set and activate one ring at a time, center outward.
  * **Air: the answer is painted on the dome**, readable only from the balcony.
  * **Water: the dome is painted mirror-wise.** In the still pool it shows what the rings must *become*:
    Lantern–Ice, Anvil–Water, Kite–Earth, Seed–Fire, Heron–Air. Read directly, it shows what to *set*:
    Ice, Fire, Air, Water, Earth. Either reading works if they understand the rules, which makes it forgiving.
  * Each correct ring chimes its Age's tone. The finished melody is **E – C – G – D – A**.

  **Order of the Books:** Ice, Fire, Air, Earth, Water. Each Key, set in its socket at the Concordance's base,
  throws a beam of light that unlocks the next Book's case. The Air Key also powers the lift to the balcony; the
  Water Key stills the pool.

  **Running puzzles in Unwritten.** The players solve puzzles with their heads; rolls decide whether the explorers
  pull it off under pressure, and Discover rolls buy hints (use each area's Secrets as answers). Never let a bad roll
  lock the campaign: failure costs time, adds trouble, or takes a consequence, and the story moves on.

npcs:
  - name: Ereva, the Cartographer
    high_concept: Brilliant Writer Who Could Never Wait
    aspects: ["Five Rules, One Truth", "I Hid It So Only the Patient Could Find It"]
    skills: {Research: 5, Experiment: 4, Craft: 3, Surveying: 3}
    gm_notes: >
      Never met in person. She built the Sanctuary and wrote the five Ages as lessons for herself, then sealed the
      Concordance because it can hold any Written world steady — or force one. Her journals are warm, wry, and a
      little sad. Her voice is the campaign's.
  - name: Tamsin Hale
    high_concept: Impatient Treasure-Seeking Explorer
    aspects: ["The Answer Is Always Force", "Owes Money to the Wrong People"]
    skills: {Athletics: 4, Intrusion: 3, Deceive: 3, Engineering: 2, Will: 2}
    gm_notes: >
      Optional rival. Another explorer who found a copy of the Sanctuary's Book. She arrives after the Fire Age opens
      and tries to brute-force everything (the opposite of every lesson). Use her for tension and compels: she may
      steal a Key, try to force the inner ring, or become an ally once she sees force fail. Redeemable.

maps:
  # ---------------------------------------------------------------------------------------------------------- hub
  - id: sanctuary
    name: The Cartographer’s Sanctuary
    file: maps/sanctuary.svg
    start_revealed: [awakening]
    areas:
      - id: awakening
        name: The Reading Nook
        teaser: A lamp-lit alcove
        shape: [90, 520, 200, 140]
        read_aloud: >
          You wake on cushions in a lamp-lit alcove that smells of old paper and cold brass. On the reading desk, a
          note is held down by a small snowflake carved from glass: “Begin where nothing changes.”
        gm_notes: The glass snowflake is the Ice glyph. It opens the first Book case in the Gallery.
        hooks:
          - {text: "Study the glass snowflake", skill: Notice, action: discover}
          - {text: "Read the note closely", skill: Research, action: discover}
        secrets: ["The snowflake has six arms with little hooks: it is a glyph, the same one carved on one Book case.",
                  "The note's handwriting matches every journal page they'll find: the Cartographer, Ereva."]
        aspects: ["Lamplight and Old Paper"]
        exits: [library]
      - id: library
        name: The Great Library
        teaser: Tall shelves in the dark
        shape: [90, 200, 230, 300]
        read_aloud: >
          Shelves rise into shadow, ladders on brass rails. Most books are ordinary: atlases, star almanacs, music
          treatises. One shelf holds nothing but empty, gilded Linking Book covers.
        gm_notes: >
          The library answers general questions (what a Linking Book is, who Ereva was). A star almanac here names
          constellations but has the five charts torn out: the players will recover them, one per Age.
        hooks:
          - {text: "Search the shelves for anything about the Cartographer", skill: Research, action: discover}
          - {text: "Leaf through the star almanac", skill: Notice, action: discover}
        secrets: ["Five pages are torn from the almanac; the index lists them: Lantern, Anvil, Kite, Seed, Heron.",
                  "A music treatise is bookmarked at the pentatonic scale: C, D, E, G, A."]
        aspects: ["Missing Pages"]
        discover: {difficulty: 0, skills: [Notice], action: discover}
        exits: [awakening, concordance]
      - id: concordance
        name: The Concordance
        teaser: A great machine under a dome
        shape: [365, 245, 270, 270]
        read_aloud: >
          Under a painted dome stands a machine of five concentric brass rings over a dark, rippling pool. Each ring
          is engraved with five glyphs and has a lever on its rim; tiny stars are punched into each rim. Around the
          base, five empty sockets wait, each carved with a glyph.
        gm_notes: >
          Push the "Concordance" handout. The innermost ring is frosted and won't move (Ice: preserve). The dome is
          too high and shadowed to read from the floor; the balcony lift is dead until the Air Key is set. The pool
          ripples (can't reflect) until the Water Key is set. Each Key set in its socket throws light to the next
          Book case.
        hooks:
          - {text: "Examine the rings and their levers", skill: Engineering, action: discover}
          - {text: "Look up at the dome", skill: Notice, action: discover}
        secrets: ["Each ring shows five glyphs: ice, fire, air, earth, water.",
                  "The star dots on each rim form a different pattern; the inner ring's is the smallest.",
                  "The innermost ring is frozen solid and already shows the snowflake glyph.",
                  "From the floor, the dome painting is hidden by the machine's own canopy."]
        aspects: ["Five Rings, Five Empty Sockets", "A Dome Too High to Read"]
        handouts: [concordance]
        discover: {difficulty: 0, skills: [Notice], action: discover}
        exits: [library, gallery, study, balcony]
      - id: gallery
        name: The Book Gallery
        teaser: Glass cases glinting
        shape: [680, 200, 230, 300]
        read_aloud: >
          Five tall glass cases, each holding a Linking Book. Each case has a brass dial ringed with five glyphs.
          Four of the cases are dark; the first, carved with a snowflake, has a faint frost on its glass.
        gm_notes: >
          The Ice case opens when its dial is set to the snowflake (the glyph from the Reading Nook). The others stay
          sealed until a Key's light reaches them, in order: Fire, Air, Earth, Water. Push each Age's "link" handout
          when they open its Book.
        hooks:
          - {text: "Set the frosted case's dial", skill: Finesse, action: overcome}
          - {text: "Peer at the sealed Books' panels", skill: Notice, action: discover}
        secrets: ["Each case is carved with its Age's glyph; the order is snowflake, flame, spiral, mirrored spiral, mirrored flame."]
        aspects: ["Five Sealed Cases"]
        handouts: [link-ice, link-fire, link-air, link-earth, link-water]
        discover: {difficulty: 0, skills: [Notice], action: discover}
        exits: [concordance]
      - id: balcony
        name: The Star Gallery
        teaser: A balcony above, out of reach
        shape: [340, 70, 320, 125]
        read_aloud: >
          The lift sighs to a stop on a curved balcony beneath the dome. From here the painting is whole: five
          constellations wheel around the sky, each with a golden glyph beneath it.
        gm_notes: >
          Reached by the lift once the Air Key is set. Push "dome-direct". Once the Water Key stills the pool, they
          can look down into it from here: push "dome-reflection". The direct view shows the glyphs to SET; the
          reflection shows what the rings must BECOME. Let them puzzle over the difference.
        hooks:
          - {text: "Copy down the dome painting", skill: Craft, action: advantage}
          - {text: "Look down into the pool below", skill: Notice, action: discover}
        secrets: ["The glyphs on the dome are painted as a mirror would show them.",
                  "Matched to the rims' star dots: Lantern=inner ring, Anvil=2nd, Kite=3rd, Seed=4th, Heron=outer."]
        aspects: ["The Whole Sky at Once"]
        handouts: [dome-direct, dome-reflection]
        exits: [concordance]
      - id: study
        name: The Cartographer’s Study
        teaser: A locked door with five bells
        shape: [400, 560, 200, 110]
        read_aloud: >
          The door swings open on its own as the last tone fades. A small study: a cold hearth, a desk, a letter, and
          a Book bound in plain leather, its first page blank.
        gm_notes: Locked until the Concordance plays its melody. Push "cartographer-letter". The blank Book is the ending.
        hooks:
          - {text: "Read the letter", skill: Research, action: discover}
        aspects: ["A Blank First Page"]
        handouts: [cartographer-letter]
        exits: [concordance]

  # ---------------------------------------------------------------------------------------------------------- ice
  - id: ice
    name: The Frozen Observatory
    file: maps/frozen-observatory.svg
    start_revealed: [arrival]
    areas:
      - id: arrival
        name: The Linking Ledge
        teaser: A snowy ledge
        shape: [60, 480, 200, 160]
        read_aloud: >
          You arrive on a ledge of blue ice. Snow falls without a sound and never seems to land. Below, a terrace of
          enormous crystal mirrors catches a low, unmoving sun.
        gm_notes: Nothing here moves or decays. The sun never sets. Cold is real (Survival vs Fair to stay comfortable for long).
        hooks:
          - {text: "Watch where the sunlight falls", skill: Notice, action: discover}
          - {text: "Find shelter from the cold", skill: Survival, action: overcome}
        secrets: ["The snowflakes hang in the air; they are frozen mid-fall."]
        aspects: ["Snow That Never Lands", "Bitter, Perfect Cold"]
        exits: [terrace]
      - id: terrace
        name: The Mirror Terrace
        teaser: Great crystal mirrors
        shape: [270, 430, 250, 210]
        read_aloud: >
          Three crystal mirrors, each taller than a door, stand on brass pivots. The low sun strikes the first; a
          beam of pale gold lies across the ice like a dropped ribbon.
        gm_notes: >
          Push "ice-mirrors". Mirror A takes the sun and can face B or C. B can face the Hall's ice wall or the Great
          Dome. C faces the cistern dam. A→B→Hall melts the wall into the Star Archive — but leave it lit more than a
          few moments and the floor melts too (the Hall floods; the passage refreezes: a scene's delay, or someone
          takes Soaked to the Bone). A→C melts the dam and floods the cistern (harmless but loud: a minor cost).
          Turning a mirror is an Athletics or Engineering overcome vs Fair (+2).
        hooks:
          - {text: "Swing mirror A on its pivot", skill: Athletics, action: overcome}
          - {text: "Work out where each mirror can point", skill: Engineering, action: discover}
        secrets: ["Each mirror's pivot has notches, each marked with where it points: Sun, B, C / Hall, Dome / Dam.",
                  "Light melts what it touches, and keeps melting."]
        aspects: ["A Ribbon of Captured Sunlight", "Mirrors Taller Than Doors"]
        handouts: [ice-mirrors]
        discover: {difficulty: 1, skills: [Notice, Surveying], action: discover}
        exits: [arrival, hall, cistern]
      - id: hall
        name: The Hall of Telescopes
        teaser: Shapes behind frosted glass
        shape: [300, 220, 250, 200]
        read_aloud: >
          Brass telescopes, frozen in place, all point at the same patch of wall. One wall is a sheet of clear blue
          ice, and through it you can see shelves of charts.
        gm_notes: The ice wall melts when B's beam reaches it. The telescopes all point to where the Dome's Lantern shutter is.
        hooks:
          - {text: "Look through a frozen telescope", skill: Notice, action: discover}
          - {text: "Test the ice wall", skill: Engineering, action: discover}
        secrets: ["Through the telescopes you see the Lantern constellation, frozen in the sky exactly as Ereva last saw it.",
                  "The ice wall is thin enough to melt with a short beam."]
        aspects: ["Telescopes Frozen Mid-Gaze", "A Wall of Clear Ice"]
        discover: {difficulty: 2, skills: [Notice, Engineering], action: overcome}
        exits: [terrace, archive, cistern]
      - id: cistern
        name: The Meltwater Cistern
        teaser: A sound of dripping
        shape: [560, 470, 220, 180]
        read_aloud: >
          A deep stone cistern of black water, half frozen. Ice floats in slow circles. On the bottom, a glint of
          brass.
        gm_notes: A dead end that teaches the cost of too much heat. The brass glint is a tuning fork (see the Archive).
        hooks:
          - {text: "Fish out the glinting brass", skill: Athletics, action: overcome}
        secrets: ["The brass is a second tuning fork, identical to the one in the Archive; both sing E when warmed."]
        aspects: ["Black, Slow Water"]
        discover: {difficulty: 2, skills: [Surveying], action: discover}
        exits: [terrace, hall]
      - id: archive
        name: The Star Archive
        teaser: Shelves of charts behind ice
        shape: [570, 220, 210, 200]
        read_aloud: >
          A dry, still room. Star charts are pinned under glass. On a pedestal stands a tiny brass copy of the
          Concordance, its innermost ring encased in ice. Beside it lies a frozen tuning fork and an open journal.
        gm_notes: >
          Push "journal-ice". The model's frozen inner ring is the clue: leave the real one alone. The tuning fork
          sings E when warmed in a hand. The Lantern chart matches the inner ring's star dots back home.
        hooks:
          - {text: "Warm the tuning fork in your hands", skill: Will, action: overcome}
          - {text: "Compare the star charts", skill: Research, action: discover}
          - {text: "Study the little Concordance model", skill: Engineering, action: discover}
        secrets: ["The Lantern chart is the one the telescopes all point at.",
                  "On the model, only the inner ring is frozen; the rest turn freely.",
                  "The fork's note is E."]
        aspects: ["A Model of the Machine", "Memory Kept Under Glass"]
        handouts: [journal-ice]
        discover: {difficulty: 2, skills: [Notice, Research], action: discover}
        exits: [hall, dome]
      - id: dome
        name: The Great Dome
        teaser: A white dome
        shape: [800, 180, 160, 260]
        read_aloud: >
          The greatest telescope of all, its housing locked in a cradle of ice. Inside the ice, something glows: a
          Resonance Key. Five shutters ring the dome, each painted with a constellation.
        gm_notes: >
          Master puzzle. Mirror B can send the beam to the Dome, but it enters through whichever shutter is open.
          Only the Lantern shutter angles the light onto the ice cradle; any other strikes the lens (it cracks:
          Cracked Lens, and the Key stays frozen until someone repairs it, Craft vs Great). With the Lantern shutter
          open and the beam on, the cradle melts in a slow, golden drip and the Key drops free.
        hooks:
          - {text: "Match a shutter to the right constellation", skill: Research, action: discover}
          - {text: "Signal the mirror crew when to send the light", skill: Rapport, action: advantage}
        secrets: ["The Lantern shutter is the third from the door.", "The Key hums faintly, like a held note."]
        aspects: ["Five Painted Shutters", "A Key Sleeping in Ice"]
        discover: {difficulty: 3, skills: [Surveying, Notice], action: discover}
        exits: [archive]

  # --------------------------------------------------------------------------------------------------------- fire
  - id: fire
    name: The Ember Forge
    file: maps/ember-forge.svg
    start_revealed: [arrival]
    areas:
      - id: arrival
        name: The Basalt Landing
        teaser: Black stone, red light
        shape: [60, 500, 200, 150]
        read_aloud: >
          Heat hits you like a hand. You stand on black basalt above a river of slow, glowing lava. Somewhere above,
          enormous gears grind; the air smells of hot metal and rain that never falls.
        gm_notes: Everything here changes as you use it. Heat is a constant pressure (Will or Survival to keep working for long).
        hooks:
          - {text: "Find the safest path along the basalt", skill: Survival, action: discover}
          - {text: "Listen to the machinery", skill: Engineering, action: discover}
        aspects: ["Heat Like a Hand", "The Ground Is Never the Same Twice"]
        exits: [valves]
      - id: valves
        name: The Valve Gallery
        teaser: Wheels and a gauge
        shape: [280, 470, 220, 180]
        read_aloud: >
          Two great valve wheels, marked A and B, stand before a pressure gauge with five marks. A counterweight hangs
          from a chain beside them.
        gm_notes: >
          Valve A sends lava east, heating the boiler: steam pressure rises one mark per minute. Valve B sends lava
          west to the Foundry's crucible (and cools the boiler). Both open: each gets half. Above mark 4 the safety
          vent blows (pressure to 0; anyone near takes Scalded unless they Athletics vs Good to dodge). The lift rises
          only with pressure at 2–4 AND the counterweight released. Solution: open A, wait for 3, release the
          counterweight, ride up; then close A and open B so the crucible melts the bronze. Opening B also diverts
          lava from the lower channel, which cools into a walkable basalt bridge to the Anvil Shrine.
        hooks:
          - {text: "Open valve A and watch the gauge", skill: Engineering, action: overcome}
          - {text: "Release the counterweight at the right moment", skill: Athletics, action: overcome}
          - {text: "Work out what each valve feeds", skill: Engineering, action: discover}
        secrets: ["A feeds the boiler (east), B the foundry crucible (west).", "The lift wants pressure between 2 and 4.",
                  "Opening B will cool the lower channel into a bridge."]
        aspects: ["Steam Pressure Rising", "A Gauge with Five Marks"]
        discover: {difficulty: 1, skills: [Engineering, Notice], action: discover}
        exits: [arrival, channels, gears]
      - id: channels
        name: The Lava Channels
        teaser: Rivers of fire
        shape: [520, 470, 260, 180]
        read_aloud: >
          Two channels of lava run side by side, bright as noon. Across them, through shimmering air, a carved shrine
          sits on an island of black rock.
        gm_notes: Impassable while the lower channel flows. After valve B opens, it cools into a basalt bridge.
        hooks:
          - {text: "Look for a way across", skill: Surveying, action: discover}
        aspects: ["Rivers Bright as Noon"]
        discover: {difficulty: 1, skills: [Surveying], action: discover}
        exits: [valves, shrine]
      - id: gears
        name: The Hall of Gears
        teaser: Grinding machinery
        shape: [280, 250, 240, 200]
        read_aloud: >
          Gears as big as houses turn slowly, driven by steam. Every few turns they shift position, and a new gap
          opens between them.
        gm_notes: Crossing between the gears is an Athletics overcome vs Fair (+2), or timing it with Notice to make an advantage first.
        hooks:
          - {text: "Time a dash between the gears", skill: Notice, action: advantage}
          - {text: "Cross while the gap is open", skill: Athletics, action: overcome}
        aspects: ["Gears as Big as Houses"]
        discover: {difficulty: 2, skills: [Notice, Athletics], action: overcome}
        exits: [valves, elevator]
      - id: elevator
        name: The Steam Lift
        teaser: A brass cage
        shape: [540, 250, 130, 200]
        read_aloud: >
          A brass cage on a chain, hissing gently. A lever inside points down.
        gm_notes: Rises only with pressure 2–4 and the counterweight released (see the Valve Gallery).
        hooks:
          - {text: "Ride the lift up", skill: Will, action: overcome}
        aspects: ["A Hissing Brass Cage"]
        exits: [gears, foundry]
      - id: foundry
        name: The Bell Foundry
        teaser: An upper chamber
        shape: [690, 100, 270, 230]
        read_aloud: >
          A crucible of cold bronze sits under a hood. Before it, five bell molds, each with a glyph cut into it as a
          hollow. Above the crucible, an anvil encases a dark lump of slag, carved with a flame.
        gm_notes: >
          Master puzzle. Push "fire-molds" and "journal-fire". With valve B open, the bronze melts. A bell cast from
          a mold comes out bearing the OPPOSITE glyph (the mold is a negative). The anvil wakes only for a flame bell,
          so they must choose the WATER mold. Ring the flame bell: it sings C, and the slag cracks to reveal the Fire
          Key. A wrong bell rings a sour note; re-melting it costs time (or a minor cost).
        hooks:
          - {text: "Choose a mold and cast a bell", skill: Craft, action: overcome}
          - {text: "Study the molds' hollows", skill: Notice, action: discover}
        secrets: ["What the mold holds as a hollow, the bell wears as a shape — reversed.",
                  "The flame bell sings C.", "Only ice comes out of the fire as ice."]
        aspects: ["Five Hollow Molds", "Bronze That Remembers Heat"]
        handouts: [fire-molds, journal-fire]
        discover: {difficulty: 3, skills: [Engineering, Craft], action: overcome}
        exits: [elevator]
      - id: shrine
        name: The Anvil Shrine
        teaser: A shrine across the lava
        shape: [800, 400, 160, 250]
        read_aloud: >
          A small shrine, its ceiling pierced with holes that let the red light through as stars: an anvil, outlined
          in fire.
        gm_notes: The Anvil constellation, matching the second ring's star dots at home. Reachable once the channel cools.
        hooks:
          - {text: "Copy the pattern of light", skill: Craft, action: advantage}
        secrets: ["The Anvil's six stars match the dots on the Concordance's second ring."]
        aspects: ["Stars Made of Fire"]
        discover: {difficulty: 2, skills: [Surveying], action: overcome}
        exits: [channels]

  # ---------------------------------------------------------------------------------------------------------- air
  - id: air
    name: The Sky Monastery
    file: maps/sky-monastery.svg
    start_revealed: [arrival]
    areas:
      - id: arrival
        name: The Wind Gate
        teaser: A floating island
        shape: [60, 500, 190, 130]
        read_aloud: >
          Wind, everywhere. You stand on a floating island of pale stone; others drift around you, tied together by
          rope bridges that sing in the gusts. Windmills turn on every roof.
        gm_notes: "Crossing bridges in a gust is Athletics vs Fair. Sound carries strangely here: a whisper at one tower can be heard at another."
        hooks:
          - {text: "Cross the singing bridge", skill: Athletics, action: overcome}
          - {text: "Listen to how sound carries", skill: Notice, action: discover}
        aspects: ["Wind Everywhere", "Bridges That Sing"]
        exits: [wheels]
      - id: wheels
        name: The Prayer-Wheel Terrace
        teaser: Painted wheels
        shape: [280, 480, 220, 145]
        read_aloud: >
          Three great prayer wheels, marked I, II and III. Spin one and a fan somewhere roars, and a tower on another
          island grinds round a quarter turn.
        gm_notes: >
          Push "air-map" (found tucked into wheel II, face-down; it reads properly only turned over — the player can
          use "Turn over"). Wheel I turns the North tower, II the South tower, III the East tower. Correct turns: I ×2,
          II ×3, III ×1. Over-turning is harmless (four turns is a full circle) but costs time.
        hooks:
          - {text: "Spin a wheel and see which tower moves", skill: Notice, action: discover}
          - {text: "Make sense of the monk's map", skill: Research, action: discover}
        secrets: ["Four turns bring a tower all the way round.", "The map is drawn with south at the top."]
        aspects: ["Wheels That Move Towers"]
        handouts: [air-map]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [arrival, south, belfry]
      - id: south
        name: The South Tower
        teaser: A tower on an island
        shape: [540, 500, 160, 130]
        read_aloud: A slim tower with a painted panel at its crown. From here the panel looks like random brushstrokes.
        gm_notes: Each tower's panel holds a fragment of the Air glyph; they align only from the listening seat in the Belfry.
        hooks:
          - {text: "Study the painted panel", skill: Notice, action: discover}
        aspects: ["Brushstrokes Without a Picture"]
        discover: {difficulty: 1, skills: [Athletics], action: overcome}
        exits: [wheels, east]
      - id: east
        name: The East Tower
        teaser: A tower to the east
        shape: [760, 330, 170, 135]
        read_aloud: A tower whose open windows hum when the wind is right, like a bottle blown across.
        gm_notes: Each tower sings one pitch of a chord when its windows face the wind. Aligned, the chord carries to the Summit.
        hooks:
          - {text: "Listen to the windows hum", skill: Notice, action: discover}
        aspects: ["Windows That Hum"]
        discover: {difficulty: 2, skills: [Athletics], action: overcome}
        exits: [south, summit]
      - id: belfry
        name: The Belfry of Chimes
        teaser: Chimes in the wind
        shape: [230, 230, 190, 160]
        read_aloud: >
          Hundreds of chimes hang from a bell-frame. In the middle of the floor, a single stone seat faces the towers.
          A brass plaque reads: “Sit. Look. Do not move.”
        gm_notes: >
          The listening seat. With the towers turned correctly, the three panel fragments line up into the Air
          glyph (a spiral), and the wind through the towers sounds a chord; the deepest chime answers with G. Push
          "journal-air" when the glyph aligns: Ereva's page is pinned under the seat.
        hooks:
          - {text: "Sit in the listening seat and look", skill: Notice, action: discover}
          - {text: "Pick out the note among the chimes", skill: Empathy, action: discover}
        secrets: ["From the seat, the towers' panels overlap into one picture.", "The deepest chime sings G."]
        aspects: ["The Listening Seat"]
        handouts: [journal-air]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [wheels, north]
      - id: north
        name: The North Tower
        teaser: A tower high above
        shape: [450, 90, 150, 130]
        read_aloud: The highest tower. From its stair you can see the Summit Shrine, and a pattern laid in its floor.
        gm_notes: The North Tower's stair overlooks the Summit floor, where the Kite constellation is laid in stones.
        hooks:
          - {text: "Climb the stair and look down", skill: Athletics, action: overcome}
        aspects: ["The Highest Stair"]
        discover: {difficulty: 2, skills: [Athletics], action: overcome}
        exits: [belfry, summit]
      - id: summit
        name: The Summit Shrine
        teaser: A shrine at the top
        shape: [640, 90, 260, 165]
        read_aloud: >
          A wind-locked door of slatted bronze. When the towers' chord reaches it, the slats turn like a flock of
          birds and let you in. On the floor, white stones make a kite of stars around a spiral; in the spiral's eye,
          the Air Key spins slowly in the wind.
        gm_notes: >
          Master puzzle reward. The door opens only to the chord (all three towers aligned). The floor pattern is
          meant to be seen from above (from the North Tower) — the clue that the Sanctuary's answer is on the dome,
          seen from the balcony. Setting the Air Key at home powers the Sanctuary lift.
        hooks:
          - {text: "Take the spinning Key", skill: Finesse, action: overcome}
          - {text: "Read the floor from above", skill: Notice, action: discover}
        secrets: ["The Kite's stars match the third ring's dots.", "The floor's pattern only makes sense from above."]
        aspects: ["A Floor Painted for the Sky", "A Key Spinning in the Wind"]
        discover: {difficulty: 3, skills: [Notice, Surveying], action: discover}
        exits: [east, north]

  # -------------------------------------------------------------------------------------------------------- earth
  - id: earth
    name: The Verdant Labyrinth
    file: maps/verdant-labyrinth.svg
    start_revealed: [arrival]
    areas:
      - id: arrival
        name: The Root Gate
        teaser: An arch of roots
        shape: [60, 500, 180, 150]
        read_aloud: >
          You arrive under an arch of roots as thick as pillars. Moss, ruins, birdsong. Everything here is slowly
          growing; you can almost hear it.
        gm_notes: Things grow in real time here when given water and sun, but only in order. Rushing never helps.
        hooks:
          - {text: "Read the ruins' carvings", skill: Research, action: discover}
        aspects: ["Everything Is Growing", "Roots as Thick as Pillars"]
        exits: [clearing]
      - id: clearing
        name: The Sun Clearing
        teaser: A bright clearing
        shape: [270, 470, 210, 180]
        read_aloud: >
          A circle of sunlight falls through the canopy onto a bronze sun-mirror on a swivel, tarnished green.
        gm_notes: The sun-mirror can throw light onto one garden bed at a time (Engineering or Finesse to aim it, vs Fair).
        hooks:
          - {text: "Aim the sun-mirror at a garden bed", skill: Finesse, action: overcome}
        aspects: ["A Green Bronze Sun-Mirror"]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [arrival, gardens]
      - id: cisterns
        name: The Rain Cisterns
        teaser: Stone tanks
        shape: [60, 240, 190, 200]
        read_aloud: Three stone tanks full of rainwater, each with a sluice gate leading to the garden terraces.
        gm_notes: Each sluice waters one bed. Bridgevine's growth will choke the middle sluice, so grow it last.
        hooks:
          - {text: "Open a sluice gate", skill: Athletics, action: overcome}
        secrets: ["The middle sluice runs right beside the Bridgevine bed."]
        aspects: ["Sluice Gates of Old Stone"]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [gardens]
      - id: gardens
        name: The Terraced Gardens
        teaser: Overgrown terraces
        shape: [280, 220, 240, 220]
        read_aloud: >
          Four seed beds, each labeled in a gardener's hand: Stairbloom, Ladder-reed, Bridgevine, Thornwall.
        gm_notes: >
          Water + sun make a bed grow (in minutes). Stairbloom (water) grows stairs up to the Calendar terrace.
          Ladder-reed (sun) grows a ladder down into the Heart Tree's hollow. Bridgevine (water AND sun) grows a
          bridge over the Ravine — and chokes the middle sluice, so grow it last. Thornwall (anything) walls off the
          Ravine path: don't. The calendar's verse gives the order: "Rain, then Sun, then both."
        hooks:
          - {text: "Water the Stairbloom", skill: Survival, action: overcome}
          - {text: "Plan the order of growing", skill: Research, action: advantage}
        secrets: ["Growing one bed can block another.", "Thornwall grows a wall across the Ravine path."]
        aspects: ["Four Sleeping Seed Beds", "Growing One Path Blocks Another"]
        discover: {difficulty: 1, skills: [Notice, Survival], action: discover}
        exits: [clearing, cisterns, ravine]
      - id: ravine
        name: The Ravine
        teaser: A deep cleft
        shape: [540, 300, 100, 350]
        read_aloud: A cleft too wide to jump, its bottom lost in ferns. The far side holds a stone terrace and an enormous tree.
        gm_notes: Crossable once Bridgevine grows (or a dangerous Athletics vs Great jump).
        hooks:
          - {text: "Look for a way across", skill: Surveying, action: discover}
        aspects: ["Too Wide to Jump"]
        discover: {difficulty: 1, skills: [Surveying], action: discover}
        exits: [gardens, calendar]
      - id: calendar
        name: The Calendar Stone
        teaser: A carved stone disc
        shape: [660, 430, 270, 220]
        read_aloud: >
          A great stone of five nested rings, each carved with the same five seasons: Rain, Sun, Rain & Sun, Growth,
          Rest. A plaque: “Each wheel, turned, turns the one outside it.”
        gm_notes: >
          Master puzzle (a rehearsal for the Concordance's Earth rule). Push "earth-calendar" and "journal-earth".
          All five rings must show Rest. Turning a ring advances it one season AND the next ring outward one season.
          Start (inner→outer): Sun, Rest, Rain, Growth, Rain & Sun. Solution, inner first: turn ring 1 ×3, ring 2 ×2,
          ring 3 ×2, ring 4 ×4, ring 5 ×3. Working outside-in undoes itself. Each turn sounds a low drum: D.
        hooks:
          - {text: "Turn the inner ring", skill: Athletics, action: overcome}
          - {text: "Work out how the rings affect each other", skill: Experiment, action: advantage}
        secrets: ["Turning a ring moves the one outside it.", "Begin at the heart.", "The stone drums a low D."]
        aspects: ["Five Rings of Seasons", "Each Turn Moves the Next"]
        handouts: [earth-calendar, journal-earth]
        discover: {difficulty: 2, skills: [Research, Experiment], action: discover}
        exits: [ravine, heart]
      - id: heart
        name: The Heart Tree
        teaser: An enormous tree
        shape: [670, 100, 260, 280]
        read_aloud: >
          When the last ring settles on Rest, the great tree sighs; its bark parts like a curtain. Inside, on a bed of
          roots, lies the Earth Key, and above it, carved into the heartwood, a seed of stars.
        gm_notes: Opens when the calendar is solved (Ladder-reed gives the way down into the hollow).
        hooks:
          - {text: "Climb down into the hollow", skill: Athletics, action: overcome}
        secrets: ["The Seed constellation matches the fourth ring's dots."]
        aspects: ["A Seed of Stars in the Heartwood"]
        discover: {difficulty: 3, skills: [Notice], action: discover}
        exits: [calendar]

  # -------------------------------------------------------------------------------------------------------- water
  - id: water
    name: The Tidal Cathedral
    file: maps/tidal-cathedral.svg
    start_revealed: [arrival]
    areas:
      - id: arrival
        name: The Moon Steps
        teaser: Steps into water
        shape: [60, 520, 180, 140]
        read_aloud: >
          Moonlight. Wide steps lead down into still water that fills a cathedral nave. Glass floors shine beneath the
          surface, and everything is doubled: every pillar has a twin hanging below it.
        gm_notes: The water level is controlled by the Tide Wheel. Start at Mid tide.
        aspects: ["Everything Doubled", "Moonlight on Still Water"]
        exits: [nave]
      - id: nave
        name: The Flooded Nave
        teaser: A flooded hall
        shape: [260, 300, 300, 360]
        read_aloud: >
          You wade along a glass floor. Above, the vaulted ceiling is painted with backward letters. In the water's
          reflection, they read the right way round.
        gm_notes: "Read the ceiling in reflection (Mid tide, still water): “The tide wheel turns the doors.”"
        hooks:
          - {text: "Read the ceiling in the reflection", skill: Notice, action: discover}
        secrets: ["The ceiling text reads, in reflection: THE TIDE WHEEL TURNS THE DOORS."]
        aspects: ["Words Written Backwards", "Glass Floor Underfoot"]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [arrival, wheel, choir, moonpool]
      - id: wheel
        name: The Tide Wheel
        teaser: A great brass wheel
        shape: [60, 280, 180, 200]
        read_aloud: A brass wheel with three marks — a dry stone, a half moon, a full wave — moves the whole sea.
        gm_notes: >
          Three levels. LOW: the Moon Pool's niche is dry and reachable; the crypt arch is just paint on a wall.
          MID: still water, perfect reflections; the choir bell, half-drowned, rings A. HIGH: the crypt floods and its
          painted arch becomes a real, underwater passage to the Apse (swim: Athletics vs Fair). Someone has to stay
          at the wheel while others explore: a good teamwork moment.
        hooks:
          - {text: "Turn the wheel", skill: Athletics, action: overcome}
        secrets: ["Some doors exist only underwater; others only above it."]
        aspects: ["The Wheel That Moves the Sea"]
        discover: {difficulty: 1, skills: [Engineering], action: discover}
        exits: [nave]
      - id: choir
        name: The Choir of Bells
        teaser: Bells half in water
        shape: [580, 450, 220, 210]
        read_aloud: Bells hang at every height, some in air, some underwater. The water changes how each one sounds.
        gm_notes: At Mid tide one bell sits exactly at the waterline and rings a clear A. Any other level, a muffled thud.
        hooks:
          - {text: "Strike the bells and listen", skill: Notice, action: discover}
        secrets: ["At Mid tide, the waterline bell rings A."]
        aspects: ["Bells Half Drowned"]
        discover: {difficulty: 1, skills: [Notice], action: discover}
        exits: [nave, crypt]
      - id: moonpool
        name: The Moon Pool
        teaser: A round pool
        shape: [260, 80, 300, 200]
        read_aloud: >
          A round pool under an open oculus where the moon sits. Letters run around its rim, every one reversed.
        gm_notes: >
          Push "water-alphabet" (the rim and a mirror-alphabet key). At Low tide a dry niche opens below the rim:
          Ereva's journal page ("journal-water").
        hooks:
          - {text: "Read the rim with the mirror alphabet", skill: Research, action: discover}
          - {text: "Search the dry niche at low tide", skill: Notice, action: discover}
        secrets: ["The rim reads: SEE IT ONLY IN ITS REFLECTION.", "The flame and the drop are each other's reflection."]
        aspects: ["Letters Turned Around"]
        handouts: [water-alphabet, journal-water]
        discover: {difficulty: 2, skills: [Notice, Research], action: discover}
        exits: [nave]
      - id: crypt
        name: The Drowned Crypt
        teaser: A dark crypt
        shape: [580, 250, 220, 180]
        read_aloud: A low crypt. On the far wall, an arch is painted, so lifelike you reach out to touch it — and touch stone.
        gm_notes: At High tide the painted arch is a real passage, underwater. Above water it is only paint.
        hooks:
          - {text: "Dive and feel along the painted arch", skill: Athletics, action: overcome}
        secrets: ["Underwater, the painted arch is open."]
        aspects: ["A Door Made of Paint"]
        discover: {difficulty: 2, skills: [Notice], action: discover}
        exits: [choir, apse]
      - id: apse
        name: The Apse
        teaser: Light under water
        shape: [820, 160, 140, 400]
        read_aloud: >
          You surface in a round apse lit by moonlight through blue glass. Beneath a glass floor, a reliquary holds the
          last Key. Its lock has three dials; above you, three glyphs are painted on the ceiling, and a heron of stars
          wades across it.
        gm_notes: >
          Master puzzle (a rehearsal for the Concordance's Water rule). The ceiling glyphs are painted mirror-wise.
          Looking straight up you see Water, Air, Ice; in the still floor's reflection (Mid tide) you see the truth:
          Fire, Earth, Ice. The lock wants the reflection: Fire, Earth, Ice. Setting the direct view hisses and lets a
          little water in (a minor cost). Once the Water Key is set at home, the Concordance pool stills.
        hooks:
          - {text: "Read the ceiling in the reflection", skill: Notice, action: discover}
          - {text: "Set the reliquary's dials", skill: Finesse, action: overcome}
        secrets: ["Directly: water, air, ice. In reflection: fire, earth, ice.",
                  "The Heron's stars match the outermost ring's dots."]
        aspects: ["Three Painted Glyphs", "The Last Key Under Glass"]
        discover: {difficulty: 3, skills: [Notice], action: discover}
        exits: [crypt]

handouts:
  - {id: concordance, file: handouts/concordance.svg, caption: "The Concordance: five rings, five sockets", effect: reveal}
  - {id: dome-direct, file: handouts/dome-direct.svg, caption: "The dome, seen from the balcony", effect: reveal,
     gm_notes: "Glyphs read directly = what to SET (each flips to its twin when activated)."}
  - {id: dome-reflection, file: handouts/dome-reflection.svg, caption: "The dome, seen in the still pool", effect: fade,
     gm_notes: "Only after the Water Key stills the pool. Glyphs = what each ring must BECOME."}
  - {id: cartographer-letter, file: handouts/cartographer-letter.svg, caption: "A letter on the Cartographer's desk", effect: reveal}
  - {id: link-ice, file: handouts/link-ice.svg, caption: "The Book's panel: the Frozen Observatory", effect: link}
  - {id: link-fire, file: handouts/link-fire.svg, caption: "The Book's panel: the Ember Forge", effect: link}
  - {id: link-air, file: handouts/link-air.svg, caption: "The Book's panel: the Sky Monastery", effect: link}
  - {id: link-earth, file: handouts/link-earth.svg, caption: "The Book's panel: the Verdant Labyrinth", effect: link}
  - {id: link-water, file: handouts/link-water.svg, caption: "The Book's panel: the Tidal Cathedral", effect: link}
  - {id: journal-ice, file: handouts/journal-ice.svg, caption: "Ereva's journal: the Frozen Observatory", effect: fade}
  - {id: journal-fire, file: handouts/journal-fire.svg, caption: "Ereva's journal: the Ember Forge", effect: fade}
  - {id: journal-air, file: handouts/journal-air.svg, caption: "Ereva's journal: the Sky Monastery", effect: fade}
  - {id: journal-earth, file: handouts/journal-earth.svg, caption: "Ereva's journal: the Verdant Labyrinth", effect: fade}
  - {id: journal-water, file: handouts/journal-water.svg, caption: "Ereva's journal: the Tidal Cathedral", effect: fade}
  - {id: ice-mirrors, file: handouts/ice-mirrors.svg, caption: "Notes on the mirror terrace", effect: fade}
  - {id: fire-molds, file: handouts/fire-molds.svg, caption: "The five molds", effect: fade}
  - {id: air-map, file: handouts/air-map.svg, caption: "A monk's map, found face-down", effect: fade,
     gm_notes: "Upside down on purpose: players can press Turn over."}
  - {id: earth-calendar, file: handouts/earth-calendar.svg, caption: "A rubbing of the Calendar Stone", effect: fade}
  - {id: water-alphabet, file: handouts/water-alphabet.svg, caption: "Letters on the Moon Pool's rim", effect: fade}

chapters:
  - title: "Prologue: The Sanctuary"
    summary: Wake in the library, meet the Concordance, open the first Book.
    scenes:
      - id: waking
        title: Waking in the Sanctuary
        map: sanctuary
        reveal: [awakening]
        read_aloud: >
          You don't remember arriving. You remember a Book, a hand on a page, and then this: lamplight, cushions,
          the smell of old paper and cold brass, and a silence so deep you can hear the building settle.
        goal: Explore the Sanctuary, find the Concordance, and open the first Book.
        gm_notes: >
          Let them explore freely: Reading Nook → Library → Concordance → Gallery. Reveal areas as they enter.
          Push the Concordance handout when they see it. The frosted case opens with the snowflake glyph; push
          "link-ice" when they open the Book.
        aspects: ["Lamplight and Old Paper", "A Silence You Can Hear"]
        npcs: ["Ereva, the Cartographer"]
        handouts: [concordance, link-ice]
        compel_ideas:
          - "Someone curious tries to force the frozen inner ring: compel to make it hurt (cold burn) — and plant the first lesson."
        if_stuck:
          - "The glass snowflake on the desk matches the carving on the frosted case."
        ends_when: Someone touches the Frozen Observatory's linking panel.

  - title: "Chapter 1: The Frozen Observatory"
    summary: "Ice — Preserve. Light mirrors to melt the way; free the Key from the telescope's cradle."
    scenes:
      - id: ice-arrival
        title: Snow That Never Lands
        map: ice
        reveal: [arrival]
        read_aloud: >
          The world folds, and cold closes around you like a held breath. Blue ice, silent snow, and a sun that
          hangs low and never moves.
        goal: Learn the mirrors and reach the Star Archive.
        gm_notes: >
          Push "link-ice" as they arrive. The lesson: heat opens ways, too much heat destroys them, and some things
          are meant to stay as they are. Reveal the Terrace, Hall and Cistern as they move.
        aspects: ["Snow That Never Lands", "Bitter, Perfect Cold"]
        handouts: [link-ice, ice-mirrors]
        compel_ideas: ["An impatient explorer leaves the beam on too long, and the Hall floods."]
        if_stuck: ["The beam lies across the ice toward mirror A; follow the light.",
                   "The telescopes in the Hall all point at the same thing."]
        ends_when: They read Ereva's journal in the Star Archive.
      - id: ice-dome
        title: The Key in the Ice
        map: ice
        read_aloud: Under the white dome, the great telescope sleeps in a cradle of ice, and something inside it glows.
        goal: Free the Ice Key without cracking the lens.
        gm_notes: >
          Open the Lantern shutter and send the beam via B to the Dome. Reward: the Ice Key, the Ice glyph, tone E,
          the Lantern chart, and the journal page. Back home, the Key in its socket throws light onto the Fire case.
        aspects: ["Five Painted Shutters", "A Key Sleeping in Ice"]
        handouts: [journal-ice]
        compel_ideas: ["Someone who distrusts the old charts picks a shutter by instinct."]
        if_stuck: ["The Hall's telescopes point at the third shutter.", "The Lantern chart in the Archive matches one shutter's painting."]
        ends_when: The Ice Key is set in its socket at home and the Fire case unlocks.

  - title: "Chapter 2: The Ember Forge"
    summary: "Fire — Transform. Balance valves and pressure; cast the right bell."
    scenes:
      - id: fire-arrival
        title: Heat Like a Hand
        map: fire
        reveal: [arrival]
        read_aloud: Heat hits you like a hand. Below, a river of light; above, gears grinding like a giant's teeth.
        goal: Work out the valves and reach the Foundry.
        gm_notes: "Push \"link-fire\". The lesson: everything changes as you use it — even the paths. Optional: Tamsin Hale arrives here."
        aspects: ["Heat Like a Hand", "The Ground Is Never the Same Twice"]
        npcs: ["Tamsin Hale"]
        handouts: [link-fire]
        compel_ideas: ["Tamsin wants to open both valves all the way 'to save time' (compel a trusting or reckless aspect)."]
        if_stuck: ["The gauge's middle marks are polished from use; the ends are not.", "The lift cage won't move while the counterweight is chained."]
        ends_when: They reach the Bell Foundry.
      - id: fire-bell
        title: To Cast the Flame
        map: fire
        read_aloud: Five hollow molds wait before the crucible. Above, a flame is carved into a lump of slag on the anvil.
        goal: Cast a flame bell and wake the anvil.
        gm_notes: >
          Valve B melts the bronze. The WATER mold casts a FLAME bell (negative). Ring it: C. Reward: Fire Key,
          glyph, tone C, journal; the cooled channel lets them reach the Anvil Shrine for the Anvil constellation.
          At home, the Fire Key opens the Air case.
        aspects: ["Five Hollow Molds"]
        handouts: [fire-molds, journal-fire]
        if_stuck: ["A cracked old bell lies in the corner: its glyph is the reverse of its mold's."]
        ends_when: The Fire Key is set at home and the Air case unlocks.

  - title: "Chapter 3: The Sky Monastery"
    summary: "Air — Observe. Turn the towers; truth depends on where you stand."
    scenes:
      - id: air-arrival
        title: Wind Everywhere
        map: air
        reveal: [arrival]
        read_aloud: You arrive in wind, on an island of pale stone among drifting islands tied together with singing rope.
        goal: Turn the towers so they align from the listening seat.
        gm_notes: "Push \"link-air\". The monk's map is upside-down on purpose. Correct turns: I ×2, II ×3, III ×1."
        aspects: ["Wind Everywhere", "Bridges That Sing"]
        handouts: [link-air, air-map]
        compel_ideas: ["Someone afraid of heights freezes on a swaying bridge."]
        if_stuck: ["Try turning the map over.", "The plaque in the Belfry: Sit. Look. Do not move."]
        ends_when: The chord sounds and the Summit's slatted door opens.
      - id: air-summit
        title: A Floor Painted for the Sky
        map: air
        read_aloud: The bronze slats turn like birds. Inside, a kite of white stars is laid in the floor around a spinning Key.
        goal: Take the Air Key and understand the floor.
        gm_notes: >
          Reward: Air Key, glyph, tone G, Kite constellation, journal. At home the Air Key powers the lift to the Star
          Gallery: reveal the balcony and push "dome-direct". The Earth case opens.
        aspects: ["A Floor Painted for the Sky"]
        handouts: [journal-air, dome-direct]
        if_stuck: ["From the North Tower's stair, the floor pattern is clear."]
        ends_when: They've seen the dome from the balcony.

  - title: "Chapter 4: The Verdant Labyrinth"
    summary: "Earth — Grow. Plan the garden; solve the Calendar Stone from the heart outward."
    scenes:
      - id: earth-arrival
        title: Everything Is Growing
        map: earth
        reveal: [arrival]
        read_aloud: Moss, roots, birdsong, and the slow sound of things growing.
        goal: Grow the right paths in the right order.
        gm_notes: "Push \"link-earth\". Order: Stairbloom (water), Ladder-reed (sun), Bridgevine (both) last. Never Thornwall."
        aspects: ["Everything Is Growing", "Growing One Path Blocks Another"]
        handouts: [link-earth]
        compel_ideas: ["An impatient explorer waters everything at once."]
        if_stuck: ["A gardener's verse on the cistern: Rain, then Sun, then both."]
        ends_when: They stand before the Calendar Stone.
      - id: earth-calendar
        title: Nothing Is Solved Quickly
        map: earth
        read_aloud: Five rings of stone seasons. A plaque reads, “Each wheel, turned, turns the one outside it.”
        goal: Set every ring to Rest.
        gm_notes: >
          Start (inner→outer): Sun, Rest, Rain, Growth, Rain & Sun. Turns: ring 1 ×3, ring 2 ×2, ring 3 ×2,
          ring 4 ×4, ring 5 ×3. Reward: Earth Key, glyph, tone D, Seed constellation, journal. The Water case opens.
        aspects: ["Each Turn Moves the Next"]
        handouts: [earth-calendar, journal-earth]
        if_stuck: ["Begin at the heart.", "Write the rings' positions down and try it on paper first (Experiment to create an advantage)."]
        ends_when: The Earth Key is set at home and the Water case unlocks.

  - title: "Chapter 5: The Tidal Cathedral"
    summary: "Water — Reflect. Move the tide; read the world in its reflection."
    scenes:
      - id: water-arrival
        title: Everything Doubled
        map: water
        reveal: [arrival]
        read_aloud: Moonlight on still water. Every pillar has a twin hanging beneath it.
        goal: Learn the tide levels and find the way to the Apse.
        gm_notes: Push "link-water". Low opens the niche, Mid gives reflections and the A bell, High opens the underwater arch.
        aspects: ["Everything Doubled", "Moonlight on Still Water"]
        handouts: [link-water, water-alphabet]
        compel_ideas: ["Someone who trusts their eyes reads the ceiling directly and gets it backwards."]
        if_stuck: ["The ceiling's reflection: THE TIDE WHEEL TURNS THE DOORS."]
        ends_when: They surface in the Apse.
      - id: water-apse
        title: The World Is Never Seen Directly
        map: water
        read_aloud: Moonlight through blue glass. Three glyphs on the ceiling; a reliquary beneath the glass floor.
        goal: Open the reliquary with the reflected glyphs.
        gm_notes: >
          Lock: Fire, Earth, Ice (the reflection). Reward: Water Key, glyph, tone A, Heron constellation, journal.
          At home the Water Key stills the pool: push "dome-reflection" from the balcony.
        aspects: ["Three Painted Glyphs", "The Last Key Under Glass"]
        handouts: [journal-water]
        if_stuck: ["Lower the tide to Mid and look down, not up."]
        ends_when: The last Key is set and the pool is still.

  - title: "Finale: The Concordance"
    summary: Combine all five rules and wake the machine.
    scenes:
      - id: concord
        title: Five Rules, One Truth
        map: sanctuary
        reveal: [concordance, balcony]
        read_aloud: >
          All five sockets glow. The pool beneath the rings is still as glass, and in it the dome's painted sky hangs
          upside down, clearer than you've ever seen it.
        goal: Set and wake the rings.
        gm_notes: >
          Solution (inner→outer): Lantern ring — don't turn it (Ice); just pull its lever: it sings E. Anvil ring —
          set Fire, pull lever → Water, chimes C.
          Kite ring — set Air → Earth, G. Seed ring — set Water → Fire, D. Heron ring — set Earth → Air, A.
          The melody is E–C–G–D–A. Activating a ring nudges the next ring outward one
          glyph, so set each ring only after waking the one inside it. Wrong result: a sour note; a reset wheel at the
          base clears rings 2–5 (a minor cost: time, or Tamsin gets impatient). Forcing the inner ring cracks its
          frost (it can be turned back to Ice, but it hurts: a consequence).
          Consider running it as a deduction first ("How does the Concordance want to be set?").
        aspects: ["Five Rules, One Truth", "A Pool Still as Glass"]
        npcs: ["Tamsin Hale"]
        handouts: [dome-reflection, dome-direct, concordance]
        compel_ideas:
          - "Tamsin tries to set all the rings at once and pull every lever (her 'The Answer Is Always Force')."
          - "An explorer who's learned patience is tempted to rush the last ring."
        if_stuck:
          - "Remind them of each journal's last line; lay the five pages side by side."
          - "The ice ring never needs touching. Start with the ring just outside it."
          - "Offer a deduction: three rounds of reasoning, then someone declares the answer."
        ends_when: The melody plays and the Study opens.
